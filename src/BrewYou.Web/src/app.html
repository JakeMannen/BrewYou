<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/favicon.svg" />
		<script>
			(function () {
				try {
					var pref = localStorage.getItem('brewyou-theme');
					var isDarkOrBotanical = pref ? pref === 'dark' || pref === 'botanical' : true;
					var resolved = pref || 'dark';
					if (isDarkOrBotanical) {
						document.documentElement.classList.add('dark');
						document.documentElement.style.colorScheme = 'dark';
					} else {
						document.documentElement.classList.remove('dark');
						document.documentElement.style.colorScheme = 'light';
					}
					document.documentElement.setAttribute('data-theme', resolved);
				} catch (e) {}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
