<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
	<defs>
		<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#1c1917" />
			<stop offset="100%" stop-color="#09090b" />
		</linearGradient>
		<linearGradient id="amberGlow" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
			<stop offset="100%" stop-color="#d97706" stop-opacity="0.05" />
		</linearGradient>
		<linearGradient id="beerGrad" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#fbbf24" />
			<stop offset="100%" stop-color="#f59e0b" />
		</linearGradient>
	</defs>

	<!-- Rounded Squircle Badge mirroring top-left logo container -->
	<rect
		x="1"
		y="1"
		width="30"
		height="30"
		rx="8"
		fill="url(#bgGrad)"
		stroke="#f59e0b"
		stroke-opacity="0.45"
		stroke-width="1.5"
	/>
	<rect
		x="1.75"
		y="1.75"
		width="28.5"
		height="28.5"
		rx="7.25"
		fill="url(#amberGlow)"
	/>

	<!-- Amber Beer Jug -->
	<g transform="translate(5, 5.5) scale(0.916)">
		<!-- Liquid fill inside glass -->
		<path
			d="M5 10v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10Z"
			fill="#f59e0b"
			fill-opacity="0.25"
		/>

		<!-- Foam Head -->
		<path
			d="M14 7.5c-1 0-1.44.5-3 .5s-2-.5-3-.5-1.72.5-2.5.5a2.5 2.5 0 0 1 0-5c.78 0 1.57.5 2.5.5S9.44 3 11 3s2 .5 3 .5 1.72-.5 2.5-.5a2.5 2.5 0 0 1 0 5c-.78 0-1.5-.5-2.5-.5Z"
			fill="#fef3c7"
			stroke="url(#beerGrad)"
			stroke-width="1.8"
			stroke-linecap="round"
			stroke-linejoin="round"
		/>

		<!-- Mug Body -->
		<path
			d="M5 8v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"
			fill="none"
			stroke="url(#beerGrad)"
			stroke-width="1.8"
			stroke-linecap="round"
			stroke-linejoin="round"
		/>

		<!-- Mug Handle -->
		<path
			d="M17 11h1a3 3 0 0 1 0 6h-1"
			fill="none"
			stroke="url(#beerGrad)"
			stroke-width="1.8"
			stroke-linecap="round"
			stroke-linejoin="round"
		/>

		<!-- Glass Ribs -->
		<line
			x1="9"
			y1="12"
			x2="9"
			y2="18"
			stroke="#fbbf24"
			stroke-opacity="0.9"
			stroke-width="1.6"
			stroke-linecap="round"
		/>
		<line
			x1="13"
			y1="12"
			x2="13"
			y2="18"
			stroke="#fbbf24"
			stroke-opacity="0.9"
			stroke-width="1.6"
			stroke-linecap="round"
		/>
	</g>
</svg>
